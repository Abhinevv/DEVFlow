[project]
name = "devflow-ai"
version = "1.0.0"
description = "Autonomous multi-agent software engineering system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "anthropic>=2.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.templates" = ["*/template.json", "*/files/**/*", "*/files/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", "app/templates/*/files", "evaluation/benchmark", "evaluation/.data", "evaluation/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
